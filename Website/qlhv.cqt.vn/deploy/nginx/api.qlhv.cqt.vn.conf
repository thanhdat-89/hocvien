# /etc/nginx/sites-available/api.qlhv.cqt.vn  (certbot --nginx sẽ tự thêm phần HTTPS)
limit_req_zone $binary_remote_addr zone=qlhv_auth:10m rate=10r/m;

server {
  listen 80;
  server_name api.qlhv.cqt.vn;

  client_max_body_size 5m;
  gzip on;
  gzip_types application/json;

  add_header Strict-Transport-Security "max-age=31536000" always;

  # Chặn dò mật khẩu ở tầng Nginx
  location = /api/auth/login {
    limit_req zone=qlhv_auth burst=20 nodelay;
    proxy_pass http://127.0.0.1:3600;
    include /etc/nginx/snippets/qlhv-proxy.conf;
  }

  location / {
    proxy_pass http://127.0.0.1:3600;
    include /etc/nginx/snippets/qlhv-proxy.conf;
  }
}
